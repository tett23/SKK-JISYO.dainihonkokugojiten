  <text class="panel-title" x="24" y="70">0〜100% の軸</text>
  <line class="grid" x1="24" x2="24" y1="94" y2="160"/>
  <text class="sub" x="24" y="178" text-anchor="middle">0%</text>
  <line class="grid" x1="160.5" x2="160.5" y1="94" y2="160"/>
  <text class="sub" x="160.5" y="178" text-anchor="middle">25%</text>
