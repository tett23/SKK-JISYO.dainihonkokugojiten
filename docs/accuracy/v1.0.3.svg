  <g>
    <title>SKK-JISYO.dainihonkokugojiten.noL: 99.8%（95% 信頼区間 99.4%〜99.9%、1995/2000）</title>
    <text class="label" x="24" y="252">SKK-JISYO.dainihonkokugojiten.noL<tspan class="count" dx="10">サンプル数 2000 件（正しい 1995 件）</tspan></text>
    <line class="ci" x1="506.23644538271225" x2="558.3340687595919" y1="274" y2="274"/>
    <line class="ci" x1="506.23644538271225" x2="506.23644538271225" y1="268" y2="280"/>
    <line class="ci" x1="558.3340687595919" x2="558.3340687595919" y1="268" y2="280"/>
    <circle class="dot" cx="542.7000000000006" cy="274" r="5"/>
    <text class="value" x="586" y="272">99.8%</text>
    <text class="sub" x="586" y="288">99.4%〜99.9%</text>
  </g>
  <text class="note" x="24" y="356">点は正解率、線は 95% 信頼区間（Wilson スコア区間）、破線は基準 99.0%。</text>
  <text class="note" x="24" y="372">判定: AI（Claude）が紙面画像と照合（SKK の見出しと表記の両方が紙面の見出しと合うものを正とする。注釈は評価の対象外）。</text>
  <text class="note" x="24" y="388">抜き取り: 各辞書から無作為に 2000 件（シード値 2774640519）、2026-09-25、コミット d93700b。</text>
  <text class="note" x="24" y="404">図の出力: 2026-09-25。</text>
  <text class="note" x="24" y="420">シード値の事前記録: 確認済み（シード値の記録 5e58397 2026-09-25 → 判定の記録 88f29c6 2026-09-25）</text>
  <text class="note" x="24" y="436">人の確認: 必要だが未実施（理由: OCR 済みの入力が v1.0.2 と異なるか、記録が無い、v1.0.2 から規則が変わった（src/cleanse.ts、</text>
  <text class="note" x="24" y="452">　src/recheck.ts））</text>
  <text class="note" x="24" y="468">注意: L 除外辞書だけを評価した（検証済み・未検証の辞書は測っていない）。戻す候補の選び方は、未検証にした候補の開発用の抜き取り</text>
  <text class="note" x="24" y="484">　（420 件）を見て決めたが、この標本はそれと別のシード値で、規則をコミットした後に抜き取った</text>
