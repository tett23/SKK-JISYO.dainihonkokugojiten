  <line class="target" x1="564.54" x2="564.54" y1="88" y2="160"/>
  <text class="target-label" x="564.54" y="84" text-anchor="middle">基準 99%</text>
  <g>
    <title>SKK-JISYO.dainihonkokugojiten.noL: 99.8%（95% 信頼区間 99.4%〜99.9%、1995/2000）</title>
    <text class="label" x="24" y="110">SKK-JISYO.dainihonkokugojiten.noL<tspan class="count" dx="10">サンプル数 2000 件（正しい 1995 件）</tspan></text>
    <line class="ci" x1="566.8118222691356" x2="569.4167034379795" y1="132" y2="132"/>
    <line class="ci" x1="566.8118222691356" x2="566.8118222691356" y1="126" y2="138"/>
    <line class="ci" x1="569.4167034379795" x2="569.4167034379795" y1="126" y2="138"/>
