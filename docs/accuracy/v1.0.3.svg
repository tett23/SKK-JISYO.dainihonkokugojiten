  <text class="panel-title" x="24" y="212">拡大（95〜100% の軸）</text>
  <line class="grid" x1="24" x2="24" y1="236" y2="302"/>
  <text class="sub" x="24" y="320" text-anchor="middle">95%</text>
  <line class="grid" x1="133.2" x2="133.2" y1="236" y2="302"/>
  <text class="sub" x="133.2" y="320" text-anchor="middle">96%</text>
  <line class="grid" x1="242.4" x2="242.4" y1="236" y2="302"/>
  <text class="sub" x="242.4" y="320" text-anchor="middle">97%</text>
  <line class="grid" x1="351.59999999999997" x2="351.59999999999997" y1="236" y2="302"/>
  <text class="sub" x="351.59999999999997" y="320" text-anchor="middle">98%</text>
  <line class="grid" x1="460.8" x2="460.8" y1="236" y2="302"/>
  <text class="sub" x="460.8" y="320" text-anchor="middle">99%</text>
  <line class="grid" x1="570" x2="570" y1="236" y2="302"/>
  <text class="sub" x="570" y="320" text-anchor="middle">100%</text>
  <line class="target" x1="460.8" x2="460.8" y1="230" y2="302"/>
