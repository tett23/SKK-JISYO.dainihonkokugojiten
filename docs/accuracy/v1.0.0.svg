<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 736" width="720" height="736" role="img" aria-labelledby="title desc">
  <title id="title">辞書ごとの正解率（v1.0.0）</title>
  <desc id="desc">SKK-JISYO.dainihonkokugojiten: 99.6%（95% 信頼区間 98.4%〜99.9%、448/450）、SKK-JISYO.dainihonkokugojiten.noL: 99.1%（95% 信頼区間 97.7%〜99.7%、446/450）、SKK-JISYO.dainihonkokugojiten.unverified: 55.6%（95% 信頼区間 50.9%〜60.1%、250/450）。点は正解率、線は 95% 信頼区間（Wilson スコア区間）、破線は基準 99.0%。 判定: AI（Claude）が紙面画像と照合（SKK の見出しと表記の両方が紙面の見出しと合うものを正とする。注釈は評価の対象外）。 抜き取り: 各辞書から無作為に 450 件（150 件ずつ 3 回、シード値 101、202、303）、2026-09-25、コミット cb202ad (v1.0.0)。 図の出力: 2026-09-25。 シード値の事前記録: 未確認（シード値 101、202、303 は beta5 の評価で各 150 件を判定する前に決めたが、初めて記録したのは結果と同じコミット a6bc598 のため、履歴では確かめられない） 人の確認: 必要だが未実施（理由: 最初の評価） 注意: 検証済みの辞書の抜き取りは beta5 の評価と同じ標本（L 除外辞書もその一部を使う）。この標本は規則の調整には使っていないが、beta ごとに新しい標本で測り、点推定が初めて 99% を超えた回で止めて 1.0.0 としたため、偶然高めに出た回を採りやすく、正解率は高めに出ている可能性がある。1.0.0 の根拠は点推定が 99% 以上であることで、信頼区間の下限（98.4%）は 99% を下回っている</desc>
  <style>
    svg { --surface: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e; --grid: #e4e3df; --series-1: #2a78d6; --target: #52514e; }
    @media (prefers-color-scheme: dark) {
      svg { --surface: #1a1a19; --text-primary: #ffffff; --text-secondary: #c3c2b7; --grid: #3a3a37; --series-1: #3987e5; --target: #c3c2b7; }
    }
    .bg { fill: var(--surface); }
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .title { fill: var(--text-primary); font-size: 16px; font-weight: 600; }
    .panel-title { fill: var(--text-primary); font-size: 12px; font-weight: 600; }
    .label { fill: var(--text-primary); font-size: 13px; }
    .value { fill: var(--text-primary); font-size: 13px; font-weight: 600; }
    .sub { fill: var(--text-secondary); font-size: 11px; font-weight: 400; }
    .count { fill: var(--text-secondary); font-size: 12px; font-weight: 400; }
    .note { fill: var(--text-secondary); font-size: 10.5px; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .target { stroke: var(--target); stroke-width: 1; stroke-dasharray: 4 3; }
    .target-label { fill: var(--text-secondary); font-size: 10.5px; }
    .ci { stroke: var(--series-1); stroke-width: 2; stroke-linecap: round; }
    .dot { fill: var(--series-1); stroke: var(--surface); stroke-width: 2; }
  </style>
