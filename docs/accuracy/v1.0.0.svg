  <text class="note" x="24" y="672">人の確認: 必要だが未実施（理由: 最初の評価）</text>
  <text class="note" x="24" y="688">注意: 検証済みの辞書の抜き取りは beta5 の評価と同じ標本（L 除外辞書もその一部を使う）。この標本は規則の調整には使っていないが、</text>
