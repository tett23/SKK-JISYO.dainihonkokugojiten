  <desc id="desc">SKK-JISYO.dainihonkokugojiten.noL: 99.3%（95% 信頼区間 98.7%〜99.7%、1192/1200）。点は正解率、線は 95% 信頼区間（Wilson スコア区間）、破線は基準 99.0%。 判定: AI（Claude）が紙面画像と照合（SKK の見出しと表記の両方が紙面の見出しと合うものを正とする。注釈は評価の対象外）。 抜き取り: 各辞書から無作為に 1200 件（シード値 1696687518）、2026-09-25、コミット 0458218。 図の出力: 2026-09-25。 シード値の事前記録: 未確認（シード値を記録した sample.json がまだコミットされていない） 人の確認: 必要だが未実施（理由: v1.0.0 から規則が変わった（src/align.ts、src/build.ts、src/cleanse.ts）） 注意: L 除外辞書だけを評価した（検証済み・未検証の辞書は測っていない）。v1.0.2 の途中の評価で、リリースしていない。目標（信頼区間の下限 99%）に届かなかったが、この結果は捨てずに記録する</desc>
