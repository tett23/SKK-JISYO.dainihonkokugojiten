# 辞書をビルドしてリリースする。
#
# - バージョンタグ（v*）の push: そのタグのリリースを作る。ハイフンを含むタグ
#   （v1.1.0-beta.1 など）はプレリリースにする
# - 毎週日曜 03:00 JST と手動実行: タグ build-YYYYMMDD のプレリリースを作る。
#   JMdict のライセンス（https://www.edrdg.org/edrdg/licence.html）は、JMdict を使う
#   ソフトウェアに最新版からの定期的な更新の手順を求めているので、毎週ビルドし直す
name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dictionary
          path: dist/release

      - name: Decide tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            case "$tag" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          else
            tag="build-$(date -u +%Y%m%d)"
            if gh release view "$tag" >/dev/null 2>&1; then tag="$tag-$GITHUB_RUN_NUMBER"; fi
            prerelease=true
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"

      - name: Package
        run: scripts/package-release.sh "$TAG" dist/release "$RUNNER_TEMP"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 前のリリース（プレリリースを除く最新）の辞書と比べ、追加・削除した見出し語をリリースノートに足す
      - name: Changes from the previous release
        run: |
          prev=$(gh release list --exclude-pre-releases --limit 20 --json tagName --jq '.[].tagName' | grep -vx "$TAG" | head -1 || true)
          if [ -z "$prev" ]; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/prev"
          gh release download "$prev" --pattern "SKK-JISYO.dainihonkokugojiten-$prev.tar.gz" --dir "$RUNNER_TEMP/prev"
          tar -xzf "$RUNNER_TEMP/prev/SKK-JISYO.dainihonkokugojiten-$prev.tar.gz" -C "$RUNNER_TEMP/prev"
          deno run --allow-read --allow-write scripts/release_diff.ts \
            "$RUNNER_TEMP/prev/SKK-JISYO.dainihonkokugojiten-$prev/utf-8" dist/release/utf-8 "$prev" \
            "$RUNNER_TEMP/changes.md" "$RUNNER_TEMP/changes.tsv"
          { echo; cat "$RUNNER_TEMP/changes.md"; } >> "$RUNNER_TEMP/notes.md"

      - name: Release
        run: |
          args=(--title "SKK-JISYO.dainihonkokugojiten $TAG" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          assets=("$RUNNER_TEMP/SKK-JISYO.dainihonkokugojiten-$TAG.tar.gz")
          if [ -f "$RUNNER_TEMP/changes.tsv" ]; then assets+=("$RUNNER_TEMP/changes.tsv"); fi
          gh release create "$TAG" "${assets[@]}" "${args[@]}"
